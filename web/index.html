<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="nova_tasks">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>nova_tasks</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script type="application/javascript">
    (function() {
      let loaderObj = null;
      Object.defineProperty(window, '$dartLoader', {
        get() {
          return loaderObj;
        },
        set(val) {
          loaderObj = val;
          if (loaderObj && loaderObj.LoadConfiguration) {
            const OriginalConfig = loaderObj.LoadConfiguration;
            loaderObj.LoadConfiguration = class extends OriginalConfig {
              constructor() {
                super();
                this.maxRequestPoolSize = 6;
              }
            };
          } else if (loaderObj) {
            let loadConfigClass = null;
            Object.defineProperty(loaderObj, 'LoadConfiguration', {
              get() {
                return loadConfigClass;
              },
              set(klass) {
                loadConfigClass = class extends klass {
                  constructor() {
                    super();
                    this.maxRequestPoolSize = 6;
                  }
                };
              },
              configurable: true
            });
          }
        },
        configurable: true
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Nova Tasks Push Notification Helper (must be before flutter_bootstrap) -->
  <script src="nova_notifications.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
