<style>
        body {
            background-color: #050505;
            color: #e5e2e1;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            padding-top: 64px; /* Space for TopAppBar */
            padding-bottom: 80px; /* Space for BottomNavBar */
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 1rem;
        }

        .neon-text-primary {
            text-shadow: 0 0 12px rgba(221, 183, 255, 0.4);
        }

        .neon-text-secondary {
            text-shadow: 0 0 12px rgba(76, 215, 246, 0.4);
        }
        
        .glow-line {
            box-shadow: 0 0 10px rgba(76, 215, 246, 0.5), inset 0 0 5px rgba(76, 215, 246, 0.3);
        }

        /* Top Bar Border Fixes as per JSON */
        .top-app-bar {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .bottom-nav-bar {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background min-h-screen antialiased selection:bg-primary selection:text-on-primary">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background/60 dark:bg-background/60 backdrop-blur-xl top-app-bar shadow-none flex justify-between items-center px-margin-mobile h-16 w-full">
<div class="flex items-center gap-base">
<div class="w-8 h-8 rounded-full overflow-hidden border border-outline/30 relative">
<img alt="User profile photo" class="w-full h-full object-cover" data-alt="A striking close-up portrait of an ethereal, tech-savvy individual illuminated by soft neon glows in a vast, minimalist gallery space. The room is illuminated by high-key, soft white lighting that creates a bright, modern light-mode aesthetic. The artwork relies on a sophisticated palette of deep blacks and pristine whites, punctuated by intense accents of vibrant red. The mood is serene yet technologically advanced." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDaa5LbZk4U6TO45jhFt16KArU8QEZIExfvK-gs_0OZGVlICnT5HukGMLTFrlZnw3gMlZiFdxG8QWemYAlqSoNovWA59PEfWy1k8N7G4vBVLeG9kg4FGU2dloPi0yk0IMGHITXAdmuBMz4DTQFjt3_K4nx4uV1bbk8LQeSdPeL9HDTxJ48pUdgJm2gqY7CcP7CMzinTf71keRS6R8IWrzbztG6T8eUnEa_otJNbGTx8V9WA51vuMd_8wDkHhRIPKEqGxQRhFeEQpqY"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tight text-primary">Nova</h1>
</div>
<button aria-label="Notifications" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0, 'wght' 300;">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="px-margin-mobile pt-md pb-xl flex flex-col gap-md max-w-2xl mx-auto w-full">
<!-- Header -->
<section class="mb-sm">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background tracking-tight">Productivity Insights</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-xs">Your performance over the last 7 days.</p>
</section>
<!-- Summary Cards Grid -->
<section class="grid grid-cols-3 gap-gutter-mobile">
<div class="glass-card p-sm flex flex-col items-center justify-center relative overflow-hidden group">
<div class="absolute inset-0 bg-primary/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<span class="material-symbols-outlined text-primary mb-xs" style="font-variation-settings: 'FILL' 0, 'wght' 200; font-size: 24px;">task_alt</span>
<span class="font-display-lg text-[28px] font-bold text-on-background neon-text-primary leading-none">154</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-xs uppercase tracking-wider">Total</span>
</div>
<div class="glass-card p-sm flex flex-col items-center justify-center relative overflow-hidden group">
<div class="absolute inset-0 bg-secondary/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<span class="material-symbols-outlined text-secondary mb-xs" style="font-variation-settings: 'FILL' 0, 'wght' 200; font-size: 24px;">local_fire_department</span>
<span class="font-display-lg text-[28px] font-bold text-on-background neon-text-secondary leading-none">12</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-xs uppercase tracking-wider">Streak</span>
</div>
<div class="glass-card p-sm flex flex-col items-center justify-center relative overflow-hidden group">
<div class="absolute inset-0 bg-tertiary/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<span class="material-symbols-outlined text-tertiary mb-xs" style="font-variation-settings: 'FILL' 0, 'wght' 200; font-size: 24px;">insights</span>
<span class="font-display-lg text-[28px] font-bold text-on-background leading-none" style="text-shadow: 0 0 12px rgba(173, 198, 255, 0.4);">92<span class="text-lg">%</span></span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-xs uppercase tracking-wider">Score</span>
</div>
</section>
<!-- Activity Graph -->
<section class="glass-card p-md relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-secondary/20 to-transparent"></div>
<div class="flex justify-between items-center mb-md">
<h3 class="font-title-md text-title-md text-on-background">Activity Graph</h3>
<span class="font-label-sm text-label-sm text-secondary bg-secondary/10 px-sm py-xs rounded-full border border-secondary/20">Weekly</span>
</div>
<!-- Faux Line Chart Area -->
<div class="h-40 w-full relative flex items-end justify-between px-xs pb-sm">
<!-- Background Grid Lines -->
<div class="absolute inset-0 flex flex-col justify-between opacity-10 pointer-events-none">
<div class="border-b border-on-surface w-full h-0"></div>
<div class="border-b border-on-surface w-full h-0"></div>
<div class="border-b border-on-surface w-full h-0"></div>
<div class="border-b border-on-surface w-full h-0"></div>
</div>
<!-- Chart SVG Replacement -->
<div class="absolute inset-0 flex items-end z-10 px-2 pb-6">
<svg class="w-full h-full preserve-3d overflow-visible" preserveaspectratio="none" viewbox="0 0 100 40">
<!-- Glow effect -->
<path d="M0,35 Q10,25 20,28 T40,15 T60,20 T80,5 T100,10" fill="none" filter="blur(4px)" stroke="rgba(76, 215, 246, 0.3)" stroke-linecap="round" stroke-width="4"></path>
<!-- Main Line -->
<path class="drop-shadow-[0_0_8px_rgba(76,215,246,0.8)]" d="M0,35 Q10,25 20,28 T40,15 T60,20 T80,5 T100,10" fill="none" stroke="#4cd7f6" stroke-linecap="round" stroke-width="1.5"></path>
<!-- Points -->
<circle cx="20" cy="28" fill="#131313" r="1.5" stroke="#4cd7f6" stroke-width="1"></circle>
<circle cx="40" cy="15" fill="#131313" r="1.5" stroke="#4cd7f6" stroke-width="1"></circle>
<circle cx="60" cy="20" fill="#131313" r="1.5" stroke="#4cd7f6" stroke-width="1"></circle>
<circle class="drop-shadow-[0_0_8px_rgba(221,183,255,0.8)]" cx="80" cy="5" fill="#131313" r="1.5" stroke="#ddb7ff" stroke-width="1"></circle>
</svg>
</div>
<!-- X-Axis Labels -->
<div class="absolute bottom-0 left-0 w-full flex justify-between px-2 text-[10px] text-on-surface-variant/50 font-medium font-label-sm">
<span>M</span>
<span>T</span>
<span>W</span>
<span>T</span>
<span>F</span>
<span>S</span>
<span>S</span>
</div>
</div>
</section>
<!-- Insights Bento Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Category Distribution -->
<section class="glass-card p-md flex flex-col justify-between min-h-[220px]">
<h3 class="font-title-md text-title-md text-on-background mb-sm">Distribution</h3>
<div class="flex items-center justify-between flex-1">
<!-- Faux Donut Chart -->
<div class="relative w-24 h-24 flex-shrink-0 flex items-center justify-center">
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 36 36">
<!-- Background Track -->
<path class="text-surface-container-highest stroke-current" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke-width="3"></path>
<!-- Work Segment (Primary) -->
<path class="text-primary stroke-current" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke-dasharray="55, 100" stroke-linecap="round" stroke-width="3" style="filter: drop-shadow(0px 0px 4px rgba(221,183,255,0.5));"></path>
<!-- Personal Segment (Secondary) -->
<path class="text-secondary stroke-current" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke-dasharray="25, 100" stroke-dashoffset="-55" stroke-linecap="round" stroke-width="3" style="filter: drop-shadow(0px 0px 4px rgba(76,215,246,0.5));"></path>
<!-- Health Segment (Tertiary) -->
<path class="text-tertiary stroke-current" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke-dasharray="10, 100" stroke-dashoffset="-80" stroke-linecap="round" stroke-width="3"></path>
</svg>
<div class="absolute inset-0 flex items-center justify-center font-label-sm text-on-background font-bold">100%</div>
</div>
<!-- Legend -->
<div class="flex flex-col gap-xs ml-md flex-grow">
<div class="flex items-center justify-between font-label-sm">
<div class="flex items-center gap-xs">
<span class="w-2 h-2 rounded-full bg-primary shadow-[0_0_6px_#ddb7ff]"></span>
<span class="text-on-surface-variant">Work</span>
</div>
<span class="text-on-background font-medium">55%</span>
</div>
<div class="flex items-center justify-between font-label-sm">
<div class="flex items-center gap-xs">
<span class="w-2 h-2 rounded-full bg-secondary shadow-[0_0_6px_#4cd7f6]"></span>
<span class="text-on-surface-variant">Personal</span>
</div>
<span class="text-on-background font-medium">25%</span>
</div>
<div class="flex items-center justify-between font-label-sm">
<div class="flex items-center gap-xs">
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
<span class="text-on-surface-variant">Health</span>
</div>
<span class="text-on-background font-medium">10%</span>
</div>
</div>
</div>
</section>
<!-- Completion Ratio -->
<section class="glass-card p-md flex flex-col justify-between min-h-[220px]">
<h3 class="font-title-md text-title-md text-on-background mb-sm">Completion Ratio</h3>
<div class="flex flex-col gap-md flex-1 justify-center">
<!-- Completed Bar -->
<div class="w-full">
<div class="flex justify-between font-label-sm mb-xs">
<span class="text-on-surface-variant">Completed</span>
<span class="text-primary font-medium">85%</span>
</div>
<div class="w-full h-1.5 bg-surface-container-highest rounded-full overflow-hidden relative">
<div class="absolute top-0 left-0 h-full bg-primary rounded-full" style="width: 85%; box-shadow: 0 0 10px rgba(221,183,255,0.6);"></div>
</div>
</div>
<!-- Pending Bar -->
<div class="w-full">
<div class="flex justify-between font-label-sm mb-xs">
<span class="text-on-surface-variant">Pending</span>
<span class="text-on-background font-medium">15%</span>
</div>
<div class="w-full h-1.5 bg-surface-container-highest rounded-full overflow-hidden relative">
<div class="absolute top-0 left-0 h-full bg-outline-variant rounded-full" style="width: 15%;"></div>
</div>
</div>
</div>
</section>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 right-0 z-50 rounded-t-xl bg-surface/60 dark:bg-surface/60 backdrop-blur-2xl bottom-nav-bar shadow-[0_-8px_24px_rgba(0,0,0,0.5)] flex justify-around items-center h-20 px-gutter-mobile pb-safe md:hidden">
<button aria-label="home" class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary/80 transition-colors active:scale-90 transition-transform w-12 h-12">
<span class="material-symbols-outlined font-label-sm text-label-sm" style="font-variation-settings: 'FILL' 0, 'wght' 300;">home</span>
</button>
<button aria-label="calendar_month" class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary/80 transition-colors active:scale-90 transition-transform w-12 h-12">
<span class="material-symbols-outlined font-label-sm text-label-sm" style="font-variation-settings: 'FILL' 0, 'wght' 300;">calendar_month</span>
</button>
<button aria-label="timer" class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary/80 transition-colors active:scale-90 transition-transform w-12 h-12">
<span class="material-symbols-outlined font-label-sm text-label-sm" style="font-variation-settings: 'FILL' 0, 'wght' 300;">timer</span>
</button>
<!-- Active Nav Item based on intent (Analytics) -->
<button aria-label="analytics" class="flex flex-col items-center justify-center relative text-primary after:content-[''] after:absolute after:-bottom-1 after:w-1 after:h-1 after:bg-primary after:rounded-full after:shadow-[0_0_8px_#ddb7ff] hover:text-primary/80 transition-colors active:scale-90 transition-transform w-12 h-12">
<span class="material-symbols-outlined font-label-sm text-label-sm" style="font-variation-settings: 'FILL' 1, 'wght' 400;">analytics</span>
</button>
<button aria-label="settings" class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary/80 transition-colors active:scale-90 transition-transform w-12 h-12">
<span class="material-symbols-outlined font-label-sm text-label-sm" style="font-variation-settings: 'FILL' 0, 'wght' 300;">settings</span>
</button>
</nav>
</body></html>
