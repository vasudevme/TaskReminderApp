<style>
        body {
            background-color: #050505; /* Z-Index 1 base */
            color: theme('colors.on-background');
            -webkit-tap-highlight-color: transparent;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid theme('colors.outline-variant');
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }
        
        /* Subtle inner glow for glass effect */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: inherit;
            box-shadow: inset 1px 1px 0px rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }
        
        .category-glow {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            filter: blur(30px);
            opacity: 0.15;
            top: -20px;
            right: -20px;
            z-index: 0;
            transition: opacity 0.3s ease;
        }
        
        .glass-card:active .category-glow {
            opacity: 0.3;
        }

        .category-icon {
            z-index: 1;
            position: relative;
        }

        .category-content {
            z-index: 1;
            position: relative;
        }

        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar {
            display: none;
        }
        
        /* Safe area padding for mobile */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        .pt-safe {
            padding-top: env(safe-area-inset-top, 0px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
