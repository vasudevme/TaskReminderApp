<style>
        body {
            background-color: #050505; /* Base Z-Index 1 Deep Black */
            color: theme('colors.on-background');
        }
        
        .glass-card {
            background-color: rgba(18, 18, 18, 0.4); /* Z-Index 2 Cards */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05); /* glass_stroke */
        }
        
        .glass-card-active {
            background-color: rgba(18, 18, 18, 0.6); /* Z-Index 3 Active Glass */
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.1); /* Inner glow */
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }

        .neon-bloom-primary {
            box-shadow: 0 0 20px 0 rgba(221, 183, 255, 0.3); /* primary color at 30% */
        }
        
        .neon-bloom-secondary {
            box-shadow: 0 0 20px 0 rgba(76, 215, 246, 0.3); /* secondary color at 30% */
        }
        
        .icon-glow-primary {
            text-shadow: 0 0 8px rgba(221, 183, 255, 0.6);
        }
        
        .icon-glow-secondary {
            text-shadow: 0 0 8px rgba(76, 215, 246, 0.6);
        }
        
        .icon-glow-error {
            text-shadow: 0 0 8px rgba(255, 180, 171, 0.6);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: theme('colors.surface-container-highest');
            transition: .4s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 2px;
            background-color: theme('colors.on-surface');
            transition: .4s;
        }

        input:checked + .slider {
            background-color: theme('colors.primary');
        }

        input:checked + .slider:before {
            transform: translateX(20px);
            background-color: theme('colors.surface');
        }

        .slider.round {
            border-radius: 24px;
        }

        .slider.round:before {
            border-radius: 50%;
        }

        /* Hide scrollbar for clean minimal look */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
